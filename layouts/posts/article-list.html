{{ define "main" }}
  <article class="pa3 pa4-ns">
    <div class="measure-wide center">
      <ul class="list pl0">
        {{ range .RegularPages.ByDate.Reverse }}
          <li class="pv3 bb b--black-10">
            <time class="db f6 gray mb2">
              {{ .Date.Format "2006-01-02" }}
            </time>
            <a class="f4 link dark-blue" href="{{ .RelPermalink }}">
              {{ .Title }}
            </a>
          </li>
        {{ else }}
          <li>暂时还没有文章。</li>
        {{ end }}
      </ul>
    </div>
  </article>
{{ end }}
