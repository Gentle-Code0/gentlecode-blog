name: Publish Hugo blog

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download source and theme
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build with Hugo Docker
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HUGO_CACHEDIR=/tmp/hugo_cache \
            --env TZ=Asia/Hong_Kong \
            --volume "$GITHUB_WORKSPACE:/project" \
            --workdir /project \
            --entrypoint hugo \
            ghcr.io/gohugoio/hugo:v0.168.0 \
            --minify \
            --baseURL "https://gentlecode.wanwanma.com.cn/"

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
